<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evaluador de ensayos v2</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Evaluador de ensayos</h1>
      <p class="muted">Versión 2 — calibrada contra errores conocidos</p>
    </header>

    <section class="panel">
      <label class="section-title">Curso y rúbrica</label>
      <div class="row">
        <select id="course">
          <option value="">Seleccioná un curso</option>
          <option value="3bgu">3BGU Historia y Ciudadanía</option>
          <option value="3bgu-a">3A Historia y Ciudadanía</option>
          <option value="3bgu-b">3B Historia y Ciudadanía</option>
          <option value="3bgu-c">3C Historia y Ciudadanía</option>
          <option value="1bgu">1BGU Historia y Ciudadanía</option>
          <option value="1bgu-a">1BGU Historia y Ciudadanía A</option>
          <option value="1bgu-b">1BGU Historia y Ciudadanía B</option>
          <option value="1bgu-c">1BGU Historia y Ciudadanía C</option>
        </select>
        <select id="rubric">
          <option value="">Seleccioná una rúbrica</option>
        </select>
      </div>
      <div class="actions">
        <div class="primary">
          <button id="evalBtn" disabled>Evaluar</button>
        </div>
        <div class="secondary">
          <button id="clearBtn" class="ghost" disabled>Vaciar</button>
          <button id="clearCacheBtn" class="ghost">Limpiar cache</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <label class="section-title">Archivos</label>
      <div id="dropzone" class="dropzone">
        <div style="font-weight:700">Arrastra los ensayos aquí</div>
        <div class="muted" style="margin-top:6px">o usá el botón para elegir archivos</div>
        <input type="file" id="fileInput" multiple accept=".docx,.doc,.pdf,.txt,.md,.csv" />
      </div>
      <button id="pickFileBtn" class="ghost" style="margin-top:8px">Elegir archivos</button>
      <div id="fileList" class="file-list"></div>
    </section>

    <section class="panel">
      <label class="section-title">Resultados</label>
      <div id="results" class="results"></div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
